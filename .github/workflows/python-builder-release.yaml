name: Python builder release

on:
  pull_request_target:
    types:
      - closed
    branches:
      - master
    paths:
      - builders/python/**

permissions:
  contents: read

jobs:
  publish:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout merged source
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Python builder
        uses: docker/bake-action@v7.4.0
        with:
          files: builders/python/docker-bake.hcl
          targets: builder-python
          push: true
          vars: |
            TAGS=ghcr.io/atls/builder-python:latest
